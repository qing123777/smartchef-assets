 const maps=`https://www.google.com/maps/search/?api=1&query=${search}`;
 const detail=$('#details');detail.classList.remove('empty');
 detail.innerHTML=`<div class="photoWrap" id="photoWrap"><div class="photoPlaceholder" id="photoPlaceholder"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="9" r="1.5"/><path d="m3 17 5-5 4 4 3-3 6 5"/></svg><span>正在加载地点照片…</span></div><details class="photoCaption" id="photoCaption" hidden><summary aria-label="查看照片版权信息" title="照片版权信息">ⓘ</summary><div class="licenseContent" id="licenseContent"></div></details></div><div class="detailBody"><div class="detailTitle"><div><h3>${safe(p.zh)}</h3><span class="en">${safe(p.en)}</span></div><button type="button" class="detailClose" aria-label="关闭地点详情" title="关闭">×</button></div><div class="detailAddress"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg><span>${safe(address)}<br><small>${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}（地图坐标）</small></span></div><p class="desc">${safe(p.desc)}</p><div class="detailButtons"><a href="${maps}" target="_blank" rel="noopener noreferrer">Google Maps ↗</a></div></div>`;
 detail.querySelector('.detailClose').onclick=closeDetail;
 $('#detailShade').hidden=false;$('#detailShade').classList.add('active');
 $('#mapHeadline').textContent=p.zh;
 getPhoto(p).then(photo=>{
   if(nonce!==photoNonce||selected!==p.id)return;
   const wrap=detail.querySelector('#photoWrap'),caption=detail.querySelector('#photoCaption');if(!wrap)return;
   if(!photo){wrap.querySelector('#photoPlaceholder span').textContent='暂未取得照片，可点击 Google Maps 查看实景';return;}
   const img=new Image();img.alt=p.zh+' 地点照片';img.loading='eager';img.decoding='async';img.onload=()=>{if(nonce!==photoNonce||selected!==p.id)return;wrap.replaceChildren(img);caption.hidden=false;caption.querySelector("#licenseContent").innerHTML=`照片来源：<a href="${safe(photo.source)}" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a><br>许可：${safe(photo.license)}<br>作者：${safe(photo.artist.slice(0,100))}`};
   img.onerror=()=>{const t=wrap.querySelector('#photoPlaceholder span');if(t)t.textContent='照片加载失败，可在 Google Maps 查看实景';};img.src=photo.url;
 });
}

function select(id){const p=P.find(p=>p.id===id);if(!p)return;vis.add(id);selected=id;districts.find(d=>d.id===p.district).open=true;showDetail(p);render();syncMarkers();if(map){map.flyTo([p.lat,p.lng],15,{duration:.65});if(mapMarkers.has(id))setTimeout(()=>mapMarkers.get(id).openPopup(),650)}}
function syncMarkers(){if(!map)return;for(const p of P){const marker=mapMarkers.get(p.id);if(!marker)continue;if(vis.has(p.id))marker.addTo(map);else map.removeLayer(marker)}}
function fit(){if(!map)return;const shown=P.filter(p=>vis.has(p.id));if(shown.length)map.fitBounds(shown.map(p=>[p.lat,p.lng]),{padding:[45,45],maxZoom:13});else map.setView([35.673,139.74],12)}
$('#showAll').onclick=()=>{P.forEach(p=>vis.add(p.id));render();syncMarkers();fit()};$('#hideAll').onclick=()=>{vis.clear();render();syncMarkers()};$('#fitMap').onclick=fit;$('#zoomIn').onclick=()=>{if(map)map.zoomIn()};$('#zoomOut').onclick=()=>{if(map)map.zoomOut()};$('#searchInput').oninput=e=>{query=e.target.value.trim().toLowerCase();render()};
function showError(reason){telemetry.stage=reason;$('#mapError').hidden=false;$('#errorReason').textContent=reason;($('#status')||{textContent:''}).textContent='真实地图未能加载，请确认网络环境';}
function initLeaflet(){
 if(!window.L){showError('无法取得 Leaflet 地图库。请连接至互联网，或将网页部署到 HTTPS 网站后重试。');return;}
 try{
  map=L.map($('#realMap'),{zoomControl:false,scrollWheelZoom:true}).setView([35.673,139.74],12);
  map.attributionControl.setPrefix(false);
  L.control.zoom({position:'bottomleft'}).addTo(map);
  let goodTiles=0,failedPrimary=0;
  const primary=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'});
  primary.on('tileload',()=>{goodTiles++;telemetry.tileLoads++;$('#mapError').hidden=true;($('#status')||{textContent:''}).textContent='真实地图已加载 · 无需 API Key';telemetry.stage='OpenStreetMap 图砖加载成功';});
  primary.on('tileerror',e=>{failedPrimary++;if(telemetry.tileErrors.length<12)telemetry.tileErrors.push('OpenStreetMap: '+(e.tile?.src||'unknown'));});
  primary.addTo(map);
  setTimeout(()=>{if(!goodTiles)showError('OpenStreetMap 图砖未能加载（'+failedPrimary+' 次错误）。页面可能限制第三方地图图片；请用下方诊断检查。');},10000);
  for(const p of P){const d=districts.find(d=>d.id===p.district);
   const marker=L.circleMarker([p.lat,p.lng],{radius:9,color:'#fff',weight:2.5,fillColor:d.color,fillOpacity:1});
   marker.bindPopup(`<strong>${safe(p.zh)}</strong><br><span>${safe(p.en)}</span>`);
   marker.on('click',()=>select(p.id));mapMarkers.set(p.id,marker);
  }
  syncMarkers();fit();setTimeout(()=>map.invalidateSize(),250);
 }catch(err){showError('地图初始化发生错误：'+(err.message||'未知错误'));}
}
$('#retryMap').onclick=()=>window.location.reload();
$('#diagnoseMap').onclick=async()=>{
 const btn=$('#diagnoseMap'),out=$('#diagnostic');btn.disabled=true;out.hidden=false;out.textContent='正在检测地图资源…';
 const targets=[['OpenStreetMap','https://tile.openstreetmap.org/12/3637/1614.png'],['Leaflet CDN','https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/images/marker-icon.png']];
 const results=await Promise.all(targets.map(([name,url])=>new Promise(resolve=>{const img=new Image();let ended=false;const done=(state)=>{if(ended)return;ended=true;clearTimeout(timer);resolve(name+': '+state+' | '+url)};const timer=setTimeout(()=>done('超时 (8 秒)'),8000);img.onload=()=>done('图片加载成功');img.onerror=()=>done('图片加载失败（原因需看 Chrome Network）');img.src=url;})));
 const report=['Tokyo Travel Planner 地图诊断','页面来源: '+location.protocol+'//'+location.host,'网络状态 (navigator.onLine): '+navigator.onLine,'Leaflet: '+(window.L?'已加载':'未加载'),'成功图砖: '+telemetry.tileLoads,'目前阶段: '+telemetry.stage,'提示：图片 onerror 不会直接提供 HTTP 状态码；需检查 Network 或 Console 的 CSP / 403 / DNS 信息。',...results,'最近失败 URL:',...telemetry.tileErrors].join('\n');
 out.textContent=report;try{await navigator.clipboard.writeText(report);btn.textContent='诊断结果已复制';}catch(e){btn.textContent='已显示诊断结果（可手动复制）';}btn.disabled=false;
};

render();
// Load Leaflet from two independent CDNs; show an explicit diagnostic instead of an empty map.
function loadLeaflet(url, fallback){
 const script=document.createElement('script');script.src=url;script.async=true;
 script.onload=()=>{if(window.L)initLeaflet();else if(fallback)loadLeaflet(fallback,null);else showError('地图库下载后未能初始化。请检查浏览器的 Console。')};
 script.onerror=()=>{if(fallback)loadLeaflet(fallback,null);else showError('Leaflet 下载失败：两个 CDN 均无法连接 (jsDelivr / unpkg)。这通常是网路、DNS 或浏览器阻挡，而非景点资料问题。')};
 document.head.appendChild(script);
}
loadLeaflet('https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js','https://unpkg.com/leaflet@1.9.4/dist/leaflet.js');
})();
</script></body></html>
